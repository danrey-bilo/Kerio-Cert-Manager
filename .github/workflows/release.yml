# Тег vX.Y.Z → тесты, проверка образа и страница релиза с архивами. Секреты не нужны: образ закрыт, поэтому для проверки
# он собирается здесь из того же Dockerfile, а в Docker Hub его заранее публикует scripts/publish-image.sh.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: danreero/kerio_cert_manager

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Версия
        id: v
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Версия совпадает с файлами
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          grep -q "<Version>$VERSION</Version>" Directory.Build.props || fail "Directory.Build.props: не $VERSION"
          for file in docker-compose.yml deploy/portainer/docker-compose.yml docker-compose.demo.yml; do
            grep -q "kerio_cert_manager:$VERSION}" "$file" || fail "$file: не $VERSION"
          done
          grep -q "^## \[$VERSION\]" CHANGELOG.md || fail "CHANGELOG.md: нет раздела $VERSION"

      - name: Образ для проверки
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: docker buildx build --pull --load -f KerioCertManager.Api/Dockerfile --build-arg "VERSION=$VERSION" -t "$IMAGE:$VERSION" .

      - name: Уязвимости образа
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Файлы релиза
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          PKG="kerio-cert-manager-$TAG"
          mkdir -p "pkg/$PKG"
          sed "s|\${KCM_IMAGE:-[^}]*}|\${KCM_IMAGE:-$IMAGE:$VERSION}|" deploy/portainer/docker-compose.yml \
            > "pkg/$PKG/docker-compose.yml"
          sed "s|^KCM_IMAGE=.*|KCM_IMAGE=$IMAGE:$VERSION|" deploy/portainer/.env.example > "pkg/$PKG/.env.example"
          sed -e "s|vX\.Y\.Z|$TAG|g" -e "s|:X\.Y\.Z|:$VERSION|g" deploy/portainer/README.md > "pkg/$PKG/README.md"
          cp LICENSE LICENSE.ru.md "pkg/$PKG/"
          (cd pkg && zip -qr "../$PKG.zip" "$PKG")

          mkdir -p "cli/kerio-cert-manager/scripts"
          sed "s|\${KCM_IMAGE:-[^}]*}|\${KCM_IMAGE:-$IMAGE:$VERSION}|" docker-compose.yml \
            > "cli/kerio-cert-manager/docker-compose.yml"
          cp .env.example "cli/kerio-cert-manager/.env.example"
          cp LICENSE LICENSE.ru.md "cli/kerio-cert-manager/"
          cp scripts/gen-secrets.sh scripts/set-tunnel-token.sh scripts/reset-access.sh "cli/kerio-cert-manager/scripts/"
          chmod +x cli/kerio-cert-manager/scripts/*.sh
          (cd cli && zip -qr "../kerio-cert-manager-cli-$TAG.zip" kerio-cert-manager)

          awk -v v="$VERSION" '/^## / { show = ($0 == "## [" v "]" || index($0, "## [" v "] ") == 1); next } show' \
            CHANGELOG.md | sed '/./,$!d' > changes.md
          {
            if [ -s changes.md ]; then
              printf '## Что нового\n\n'
              cat changes.md
              printf '\n'
            fi
            sed -e "s|{TAG}|$TAG|g" -e "s|{VERSION}|$VERSION|g" -e "s|{IMAGE}|$IMAGE|g" \
              -e "s|{REPOSITORY}|$GITHUB_REPOSITORY|g" .github/release-notes.md
          } > notes.md

          sha256sum "$PKG.zip" "kerio-cert-manager-cli-$TAG.zip" > SHA256SUMS

      - name: Страница релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Kerio Cert Manager $TAG" \
            --notes-file notes.md \
            --verify-tag \
            "kerio-cert-manager-$TAG.zip" \
            "kerio-cert-manager-cli-$TAG.zip" \
            SHA256SUMS
